<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello world</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        color: #1f2937;
        background: #f8fafc;
      }

      * { box-sizing: border-box; }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
      }

      main {
        display: grid;
        gap: 14px;
        justify-items: center;
        text-align: center;
      }

      p {
        margin: 0;
        font-size: clamp(24px, 4vw, 36px);
        letter-spacing: -0.03em;
      }

      a {
        color: #2563eb;
        font-size: 16px;
        text-underline-offset: 4px;
        transition: color 160ms ease;
      }

      a:hover,
      a:focus-visible {
        color: #1d4ed8;
      }

      a:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Hello world</p>
      <a href="/excalidraw/">Excalidraw</a>
      <a href="/gm-moves/">Генератор ходов ведущего</a>
    </main>
  </body>
</html>
